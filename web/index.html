<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Jev Playtest Lab</title>
<style>body{margin:0;background:#090d16;color:#e8edf7;font:16px system-ui}main{max-width:880px;margin:64px auto;padding:24px}.tag{color:#69e3b1}button{background:#69e3b1;border:0;padding:12px 18px;border-radius:8px;font-weight:700}.card{background:#121a2a;border:1px solid #24304a;border-radius:16px;padding:24px;margin-top:24px}pre{white-space:pre-wrap;color:#a8badc}</style>
<main><p class="tag">CODE SIMULATES · JEV EVALUATES</p><h1>Playtest decisions you can replay.</h1><p>Only legal, revision-matched actions cross the execution boundary.</p><button id="run">Run offline observation</button><div class="card"><pre id="out">Ready.</pre></div></main>
<script>const sample={runId:'browser-demo',step:1,revision:1,goal:'reach exit',state:{room:'hall'},legalActions:[{id:'north',label:'Go north',simulatedOutcome:{progress:.9}},{id:'wait',label:'Wait',simulatedOutcome:{progress:0}}]};run.onclick=async()=>{out.textContent='Evaluating…';const r=await fetch('/v1/observe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(sample)});out.textContent=JSON.stringify(await r.json(),null,2)}</script>
